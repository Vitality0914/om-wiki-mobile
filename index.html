<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Om Wiki</title>
<meta name="theme-color" content="#141517">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Om Wiki">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191d;--muted:#5d6672;--line:#dde1e6;--accent:#3182f6;--accent-ink:#fff;--warn:#b54708;--bad:#c4320a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1d2127;--ink:#e9ecef;--muted:#9aa4af;--line:#2e343c;--accent:#78b0ff;--accent-ink:#0d1626;--warn:#f5a524;--bad:#ff6b4a}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:12px;margin:8px 0 22px}
.brand img{width:52px;height:52px;border-radius:13px}
.brand h1{margin:0;font-size:22px;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:0 0 14px}
.card h2{margin:0 0 6px;font-size:17px}
.card p{margin:0 0 12px;color:var(--muted);font-size:14px}
.card p:last-child{margin-bottom:0}
button,.btn{display:block;width:100%;min-height:46px;margin:8px 0 0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.small{font-size:13px;color:var(--muted)}
.error{color:var(--bad);font-size:14px;margin:10px 0 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
ol{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}ol li{margin:2px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Om Wiki</h1><p>KAMC 기본 지침 · Om 의학 Wiki</p></div></div>
  <section id="view" aria-live="polite"></section>
  <p id="error" class="error" role="alert" hidden></p>
</main>
<script src="config.js"></script>
<script src="dbx.js"></script>
<script src="boot.js"></script>
</body>
</html>
